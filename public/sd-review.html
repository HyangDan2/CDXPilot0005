<!doctype html>
<html lang="ko">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>VALKYRIE · SD motion review</title>
  <style>
    body {
      background: #101c25;
      color: #e5e8dc;
      font: 16px system-ui;
      margin: 32px auto;
      max-width: 1100px;
      padding: 16px;
    }
    h1 {
      color: #e4c47c;
    }
    button,
    select,
    input {
      padding: 9px;
      background: #253b45;
      color: inherit;
      border: 1px solid #71827b;
      margin: 4px;
    }
    canvas {
      image-rendering: pixelated;
      background: repeating-conic-gradient(#23313b 0% 25%, #1d2933 0% 50%) 0/24px 24px;
      max-width: 100%;
    }
    .row {
      display: flex;
      gap: 24px;
      align-items: center;
      flex-wrap: wrap;
    }
    a {
      color: #d7b86c;
    }
    #contact {
      width: 100%;
    }
    p {
      line-height: 1.6;
    }
  </style>
  <h1>VALKYRIE · SD 모션 검수</h1>
  <p>검과 몸이 하나인 프레임 · 기준점 십자 · 좌우 반전 · 실제 게임 크기 비교</p>
  <div>
    <select id="actor" aria-label="캐릭터">
      <option value="player">Eira</option>
      <option>grunt</option>
      <option>rusher</option>
      <option>guard</option>
      <option>boss</option></select
    ><select id="clip" aria-label="동작"></select
    ><button id="play">일시정지</button><button id="flip">좌우 반전</button
    ><label>속도 <input id="speed" type="range" min="0.25" max="1.5" step=".25" value="1" /></label>
  </div>
  <div class="row">
    <canvas id="large" width="512" height="512"></canvas
    ><canvas id="small" width="256" height="256"></canvas>
  </div>
  <p id="status"></p>
  <input id="scrub" aria-label="프레임" type="range" min="0" value="0" step="1" /><canvas
    id="contact"
  ></canvas>
  <p><a href="./">게임 실행</a> · <a href="art-review.html">이전 상세 아트 보관본</a></p>
  <script type="module">
    const m = await fetch('assets/sd-v3/manifest.json').then((r) => r.json()),
      images = {};
    await Promise.all(
      Object.keys(m.sheets).map(async (name) => {
        const i = new Image();
        i.src = `assets/sd-v3/${name}.png`;
        await i.decode();
        images[name] = i;
      }),
    );
    const $ = (id) => document.getElementById(id),
      actor = $('actor'),
      clip = $('clip'),
      scrub = $('scrub');
    const seq = (sheet, frames, duration) => [
      sheet,
      frames,
      frames.map(() => duration / frames.length),
    ];
    const range = (start, count) => Array.from({ length: count }, (_, i) => start + i);
    const player = {
      idle: seq('smooth-idle', range(0, 12), 1500),
      walk: seq('smooth-move', range(0, 8), 500),
      run: seq('smooth-move', range(8, 8), 333),
      stop: seq('smooth-stop', range(0, 6), 300),
      slash: seq('smooth-attack', range(0, 6), 467),
      slash2: seq('smooth-attack', range(6, 6), 517),
      rising: seq('smooth-attack', range(12, 6), 684),
      air: seq('smooth-attack', range(18, 6), 400),
      guard: seq('smooth-defense', range(0, 8), 830),
      spin: seq('smooth-defense', range(8, 8), 900),
      jump: seq('smooth-reaction', range(0, 8), 620),
      hit: seq('smooth-reaction', range(8, 8), 1100),
    };
    const enemy = {
      idle: [0, 1],
      walk: [2, 3, 4, 5, 6, 7, 5, 3],
      attack: [8, 9, 10, 11, 0, 1],
      hit: [12, 13, 14, 15],
    };
    let time = 0,
      last = performance.now(),
      playing = true,
      flip = false;
    function sequence() {
      if (actor.value === 'player') return player[clip.value];
      const f =
        clip.value === 'slam'
          ? [19, 20, 21, 22, 23, 0]
          : clip.value === 'charge'
            ? [15, 16, 17, 18, 0, 1]
            : actor.value === 'grunt'
              ? {
                  ...enemy,
                  walk: [2, 3, 4, 5, 3, 2, 5, 4],
                  attack: [6, 7, 8, 9, 0, 1],
                  hit: [10, 11, 12, 13, 14, 15],
                }[clip.value]
              : actor.value === 'boss'
                ? { ...enemy, attack: [7, 8, 9, 10, 11, 0], hit: [12, 13, 14, 0] }[clip.value]
                : enemy[clip.value];
      return ['smooth-' + actor.value, f, f.map(() => 140)];
    }
    function draw(c, sheet, frame, scale, ox, oy) {
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.save();
      ctx.translate(ox, oy);
      ctx.scale(flip ? -scale : scale, scale);
      ctx.drawImage(
        images[sheet],
        (frame % 4) * m.size,
        Math.floor(frame / 4) * m.size,
        m.size,
        m.size,
        -(m.sheets[sheet].origin?.[0] ?? m.origin[0]) * m.size,
        -420,
        m.size,
        m.size,
      );
      ctx.restore();
    }
    function contact() {
      const [sheet, frames] = sequence(),
        c = $('contact');
      c.width = frames.length * 200;
      c.height = 235;
      frames.forEach((f, i) => draw(c, sheet, f, 0.4, i * 200 + 80, 210));
      scrub.max = frames.length - 1;
    }
    function options() {
      clip.innerHTML = Object.keys(
        actor.value === 'player'
          ? player
          : actor.value === 'boss'
            ? { ...enemy, charge: [], slam: [] }
            : enemy,
      )
        .map((k) => `<option>${k}</option>`)
        .join('');
      time = 0;
      contact();
    }
    actor.onchange = options;
    clip.onchange = () => {
      time = 0;
      contact();
    };
    $('play').onclick = () => {
      playing = !playing;
      $('play').textContent = playing ? '일시정지' : '재생';
    };
    $('flip').onclick = () => {
      flip = !flip;
      contact();
    };
    scrub.oninput = () => {
      playing = false;
      $('play').textContent = '재생';
    };
    options();
    function loop(now) {
      const dt = now - last;
      last = now;
      const [sheet, frames, durations] = sequence(),
        total = durations.reduce((a, b) => a + b, 0);
      if (playing) time = (time + dt * Number($('speed').value)) % total;
      let f = Number(scrub.value);
      if (playing) {
        let end = 0;
        f = durations.findIndex((d) => (end += d) > time);
        scrub.value = f;
      }
      for (const [id, scale] of [
        ['large', 1],
        ['small', 0.5],
      ]) {
        const c = $(id),
          ctx = c.getContext('2d');
        ctx.clearRect(0, 0, c.width, c.height);
        const x = c.width * 0.4,
          y = c.height * 0.86;
        ctx.strokeStyle = '#d9bd73';
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(c.width, y);
        ctx.moveTo(x, y - 8);
        ctx.lineTo(x, y + 8);
        ctx.stroke();
        draw(c, sheet, frames[f], scale, x, y);
      }
      $('status').textContent =
        `${actor.value} / ${clip.value} · ${f + 1}/${frames.length} · ${durations[f]}ms · 원본 ${sheet}:${frames[f]}`;
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</html>
